<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Hash Mark — Markdown, made readable." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hash Mark</title>
    <meta name="theme-color" content="#e3e4e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint (as in Curly Brace). With no saved choice the CSS
      // follows the system through color-scheme and light-dark(). Mirrors src/features/theme.
      (function () {
        try {
          var t = localStorage.getItem('hash-mark:theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
